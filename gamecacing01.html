<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Game Cacing 💩</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #1a202c; /* Tailwind gray-900 */
            touch-action: none; /* Mencegah scrolling saat bermain di HP */
            overflow: hidden;
        }
        .pixel-font {
            font-family: 'Press Start 2P', cursive;
        }
        #game-container {
            position: relative;
            width: 100%;
            max-width: 400px;
            margin: 0 auto;
        }
        canvas {
            background-color: #2d3748; /* Tailwind gray-800 */
            border-radius: 0.75rem;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.6);
            display: block;
            width: 100%;
            height: auto;
            transition: box-shadow 0.3s ease, border-color 0.3s ease;
            border: 3px solid #4a5568;
        }
        canvas.turbo-active {
            border-color: #ecc94b;
            box-shadow: 0 0 25px rgba(236, 201, 75, 0.7);
        }
        /* Styling untuk D-Pad kontrol mobile */
        .d-pad-btn {
            background-color: rgba(74, 85, 104, 0.8);
            border-radius: 50%;
            color: white;
            font-size: 1.5rem;
            display: flex;
            justify-content: center;
            align-items: center;
            width: 50px;
            height: 50px;
            user-select: none;
            transition: background-color 0.1s;
        }
        .d-pad-btn:active {
            background-color: rgba(113, 128, 150, 0.9);
        }
        /* Animasi efek kilau pada lalat emas */
        @keyframes pulseGlow {
            0%, 100% { filter: drop-shadow(0 0 4px rgba(250, 204, 21, 0.8)); }
            50% { filter: drop-shadow(0 0 10px rgba(250, 204, 21, 1)); }
        }
    </style>
</head>
<body class="min-h-screen w-screen flex flex-col items-center justify-center text-white p-3 select-none">

    <!-- Header & Skor -->
    <div class="mb-3 text-center w-full max-w-md">
        <h1 class="text-xl sm:text-2xl font-bold mb-2 text-yellow-400 pixel-font">SNAKE TOILET 💩</h1>
        <div class="flex flex-wrap justify-center gap-2 text-xs sm:text-sm font-semibold">
            <div class="bg-gray-800 px-3.5 py-1.5 rounded-full shadow-md border border-gray-700">
                Skor: <span id="score" class="text-green-400 font-bold">0</span>
            </div>
            <div class="bg-gray-800 px-3.5 py-1.5 rounded-full shadow-md border border-gray-700">
                Tertinggi: <span id="highScore" class="text-yellow-400 font-bold">0</span>
            </div>
            <!-- Badge Indikator Tempo Dinamis -->
            <div id="tempoBadge" class="bg-emerald-900 bg-opacity-80 text-emerald-300 border border-emerald-500 px-3.5 py-1.5 rounded-full shadow-md transition-all duration-300">
                🐢 Tempo: Lambat
            </div>
        </div>
        <!-- Indikator Mode Bonus Skor 2x (Dari Item Toilet) -->
        <div id="doubleScoreBadge" class="mt-2 text-xs font-bold text-yellow-300 bg-yellow-900 bg-opacity-80 border border-yellow-500 rounded-full px-3 py-0.5 inline-block hidden animate-pulse">
            ✨ BONUS SKOR 2X AKTIF! ✨
        </div>
    </div>

    <!-- Area Game -->
    <div id="game-container">
        <!-- Canvas Permainan -->
        <canvas id="gameCanvas" width="400" height="400"></canvas>

        <!-- Layar Mulai (Start Screen) Overlay -->
        <div id="startScreen" class="absolute inset-0 bg-black bg-opacity-75 flex flex-col items-center justify-center rounded-xl backdrop-blur-sm z-20 p-4 text-center">
            <div class="text-4xl mb-3 animate-bounce">🐍💩</div>
            <h2 class="text-lg font-bold text-green-400 mb-2 pixel-font">SIAP MAKAN?</h2>
            <p class="text-xs text-gray-300 mb-5 max-w-xs">Gunakan tombol Panah / WASD atau tombol layar untuk mengarahkan cacing.</p>
            <button id="startBtn" class="bg-green-500 hover:bg-green-400 text-gray-900 font-bold py-3 px-6 rounded-full shadow-lg transform transition hover:scale-105 pixel-font text-xs cursor-pointer">
                MULAI MAIN
            </button>
        </div>

        <!-- Layar Game Over Overlay -->
        <div id="gameOverScreen" class="absolute inset-0 bg-black bg-opacity-85 flex flex-col items-center justify-center rounded-xl hidden backdrop-blur-sm z-20 p-4 text-center">
            <h2 class="text-xl font-bold text-red-500 mb-2 pixel-font leading-relaxed">GAME OVER</h2>
            <p class="text-sm text-gray-300 mb-1">Skor Akhir Kamu:</p>
            <p id="finalScore" class="font-bold text-yellow-400 text-3xl mb-5">0</p>
            <button id="restartBtn" class="bg-green-500 hover:bg-green-400 text-gray-900 font-bold py-3 px-6 rounded-full shadow-lg transform transition hover:scale-105 pixel-font text-xs cursor-pointer">
                MAIN LAGI
            </button>
        </div>
    </div>

    <!-- Legenda / Panduan Item -->
    <div class="mt-3 w-full max-w-[400px] bg-gray-800 bg-opacity-90 border border-gray-700 rounded-xl p-2.5 text-xs shadow-md">
        <div class="grid grid-cols-2 gap
